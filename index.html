<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langcampus</title>
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #ff0000;
        --background-color: #121212;
        --surface-color: #282828;
        --text-primary: #ffffff;
        --text-secondary: #aaaaaa;
        --success-color: #4caf50;
        --error-color: #f44336;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Arial, sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
        overflow: hidden;
      }
      #root {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        overflow-y: auto;
      }
      /* NEW: Styles for the footer */
      .app-footer {
        width: 100%;
        text-align: center;
        padding: 1rem;
        background-color: var(--surface-color);
        color: var(--text-secondary);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between; /* This is the key change to push content to the edges */
        align-items: center;
      }
      .footer-logo {
        height: 1.2em; /* Adjust size as needed */
        vertical-align: middle;
      }
      .app-footer a {
        color: rgba(256, 256, 256, 1) !important;
      }
      .app-footer a:visited {
        color: rgba(256, 256, 256, 1);
      }
      .help-button {
        background: transparent;
        border: none;
        color: var(--primary-color);
        font-size: 1.5rem;
        font-weight: 700;
        cursor: pointer;
        padding: 0;
        margin-left: auto; /* This also works to push it to the right */
      }
    </style>
  <script type="importmap">
{

    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
